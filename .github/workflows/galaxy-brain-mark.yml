name: Mark Galaxy Brain answers
on:
  workflow_dispatch:
    inputs:
      comment_ids:
        description: Comma-separated GraphQL comment node IDs
        required: true
permissions:
  discussions: write
jobs:
  mark:
    runs-on: ubuntu-latest
    steps:
      - name: Mark answers as discussion author
        uses: actions/github-script@v7
        with:
          script: |
            const ids = '${{ inputs.comment_ids }}'.split(',').map(s => s.trim()).filter(Boolean);
            for (const id of ids) {
              const res = await github.graphql(`
                mutation($id:ID!) {
                  markDiscussionCommentAsAnswer(input:{id:$id}) {
                    discussion { number answer { id author { login } } }
                  }
                }
              `, { id });
              console.log(JSON.stringify(res));
            }
