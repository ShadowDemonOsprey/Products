name: Seed Galaxy Brain Q&A
on:
  workflow_dispatch:
permissions:
  discussions: write
  contents: read
jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Create two Q&A discussions as github-actions[bot]
        uses: actions/github-script@v7
        with:
          script: |
            const repo = await github.rest.repos.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const cats = await github.graphql(`
              query($owner:String!, $name:String!) {
                repository(owner:$owner, name:$name) {
                  id
                  discussionCategories(first:20) {
                    nodes { id name isAnswerable }
                  }
                }
              }
            `, { owner: context.repo.owner, name: context.repo.repo });
            const qa = cats.repository.discussionCategories.nodes.find(c => c.isAnswerable);
            if (!qa) throw new Error('No Q&A category');
            for (const [title, body] of [
              ['What command lists files in a directory on Linux?', 'I need the basic shell command to list files. Please answer in Q&A so it can be marked accepted.'],
              ['What does git status show?', 'Briefly explain what the git status command displays. Please answer so it can be marked accepted.'],
            ]) {
              const created = await github.graphql(`
                mutation($repo:ID!, $cat:ID!, $title:String!, $body:String!) {
                  createDiscussion(input:{repositoryId:$repo, categoryId:$cat, title:$title, body:$body}) {
                    discussion { number url }
                  }
                }
              `, { repo: cats.repository.id, cat: qa.id, title, body });
              console.log(created.createDiscussion.discussion.url);
            }
